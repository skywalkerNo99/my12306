name: Desktop installers
on:
  workflow_dispatch:
    inputs:
      signing:
        description: '安装包签名模式（unsigned 无需证书，signed 需要签名和公证凭据）'
        type: choice
        default: unsigned
        options: [unsigned, signed]
  push:
    tags: ['desktop-v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: windows-2025
            arch: x64
    env:
      DESKTOP_SIGNING: ${{ github.event_name == 'workflow_dispatch' && inputs.signing || vars.DESKTOP_SIGNING || 'unsigned' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
            desktop/app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run desktop:install
      - run: npm run desktop:prepare
      - run: npm --prefix desktop run smoke
      - run: npm --prefix desktop run test:signing
      - run: node --test desktop/scripts/light.test.cjs
      - run: npm --prefix desktop run test:window
      - if: runner.os == 'macOS'
        run: npm --prefix desktop run test:quarantine
      - run: node desktop/scripts/dist.mjs "$DESKTOP_SIGNING"
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - run: npm --prefix desktop run smoke -- --packaged
      - if: runner.os == 'macOS' && env.DESKTOP_SIGNING == 'unsigned'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'macOS' && env.DESKTOP_SIGNING == 'unsigned'
        run: npm --prefix desktop run bundle:macos
      - run: node desktop/scripts/stage-release.mjs
      - name: Build lightweight remote client
        shell: bash
        env:
          MY12306_SIGNING: unsigned
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          node desktop/scripts/prepare-light.mjs
          cd desktop
          node node_modules/electron-builder/cli.js --config electron-builder-light.cjs --publish never
      - if: runner.os == 'macOS'
        name: Bundle lightweight client
        shell: bash
        env:
          MY12306_LIGHT: '1'
        run: node desktop/scripts/bundle-macos.mjs desktop/light-release/*.dmg
      - run: node desktop/scripts/deliver-light.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: my12306-${{ runner.os }}-${{ matrix.arch }}-${{ env.DESKTOP_SIGNING }}
          path: desktop/delivery/*
          compression-level: 0
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: my12306-*
          path: delivery
          merge-multiple: true
      - name: Publish installers to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_SIGNING: ${{ github.event_name == 'workflow_dispatch' && inputs.signing || vars.DESKTOP_SIGNING || 'unsigned' }}
        shell: bash
        run: |
          set -euo pipefail
          cd delivery
          for checksum in *.sha256; do sha256sum -c "$checksum"; done
          count=$(find . -maxdepth 1 -type f ! -name '*.sha256' | wc -l)
          test "$count" -eq 6
          cd ..
          version=$(node -p "require('./desktop/app/package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="desktop-v${version}-build.${GITHUB_RUN_ID}"
          fi
          printf 'Light 包为远程轻客户端（未签名），不含本地购票服务；普通包仍可独立运行。\n\n安装包对应提交：%s\n\nMac：下载对应架构的 bundle.zip，解压后按使用说明安装。签名版本直接下载 DMG。\nWindows：下载 EXE 安装。\n\n签名模式：%s。SHA-256 校验文件与安装包一同提供。\n' "$GITHUB_SHA" "$DESKTOP_SIGNING" > release-notes.md
          flags=()
          if [[ "$DESKTOP_SIGNING" == unsigned ]]; then flags+=(--prerelease); fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "my12306 ${version} · build ${GITHUB_RUN_ID}" --notes-file release-notes.md --draft "${flags[@]}"
          fi
          gh release upload "$tag" delivery/* --clobber
          gh release edit "$tag" --draft=false
