map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 4200;
    server_name _;
    absolute_redirect off;
    client_max_body_size 4m;
    location = / { root /usr/share/nginx/html; index index.html; }
    location = /prefect { return 302 /prefect/; }
    location /prefect/api/ {
        proxy_pass http://prefect-server:4200/api/;
        include /etc/nginx/proxy-common.conf;
    }
    location /prefect/ {
        proxy_pass http://prefect-server:4200;
        include /etc/nginx/proxy-common.conf;
    }
    # Preserve existing API clients while the UI moves under /prefect/.
    location /api/ {
        proxy_pass http://prefect-server:4200;
        include /etc/nginx/proxy-common.conf;
    }
    location = /my12306 { return 302 /my12306/; }
    location /my12306/ {
        proxy_pass http://my12306:7788/;
        include /etc/nginx/proxy-common.conf;
        proxy_cookie_path / /my12306/;
    }
    location / { return 302 /prefect$request_uri; }
}
